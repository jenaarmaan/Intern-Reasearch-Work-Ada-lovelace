version: '3.8'

services:
  luminary-ai:
    build: .
    ports:
      - "8000:8000"
      - "3000:3000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NODE_ENV=production
    restart: always
